<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Instagram - Profil</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#fafafa;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
        .container{background:#fff;max-width:400px;width:100%;border-radius:12px;border:1px solid #dbdbdb;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
        .header{padding:12px 16px;border-bottom:1px solid #efefef;display:flex;align-items:center;justify-content:space-between;background:#fff}
        .header .back{font-size:1.5em;cursor:pointer;color:#262626}
        .header h1{font-size:1.1em;font-weight:600;color:#262626}
        .header .menu{font-size:1.3em;cursor:pointer;color:#262626}
        .profile{padding:16px 20px 12px;display:flex;align-items:center;gap:20px;background:#fff}
        .profile .avatar{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 0 0 1px #dbdbdb;flex-shrink:0}
        .profile .info{flex:1}
        .profile .info .name{font-size:1.2em;font-weight:700;color:#262626}
        .profile .info .name .badge{font-size:0.6em;background:#0095f6;color:#fff;padding:1px 8px;border-radius:10px;font-weight:600;margin-left:4px;vertical-align:middle}
        .profile .info .bio{color:#8e8e8e;font-size:.85em;margin-top:2px}
        .profile .info .bio .emoji{font-size:1.1em}
        .profile .info .stats{display:flex;gap:16px;margin-top:8px}
        .profile .info .stats span{font-size:.8em;color:#8e8e8e}
        .profile .info .stats span strong{color:#262626;font-weight:700}
        .follow-section{padding:0 20px 8px;display:flex;gap:8px;background:#fff}
        .follow-section .btn-follow{flex:1;background:#0095f6;color:#fff;border:none;padding:7px 0;border-radius:8px;font-size:.85em;font-weight:600;cursor:default}
        .follow-section .btn-follow:hover{background:#0077c9}
        .follow-section .btn-message{background:#efefef;color:#262626;border:none;padding:7px 16px;border-radius:8px;font-size:.85em;font-weight:600;cursor:default}
        .btn-view{background:#0095f6;color:#fff;border:none;padding:10px;margin:4px 20px 12px;border-radius:8px;font-size:.95em;font-weight:600;cursor:pointer;width:calc(100% - 40px);transition:background .3s,transform .2s;box-shadow:0 2px 8px rgba(0,149,246,0.2)}
        .btn-view:hover{background:#0077c9}
        .btn-view:active{transform:scale(0.97)}
        .btn-view:disabled{background:#b2dffa;cursor:not-allowed;box-shadow:none}
        .btn-view .arrow{margin-left:6px}
        .highlights{padding:8px 16px 12px;display:flex;gap:16px;border-bottom:1px solid #efefef;background:#fff;overflow-x:auto}
        .highlights .item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.65em;color:#8e8e8e;flex-shrink:0}
        .highlights .item .circle{width:56px;height:56px;border-radius:50%;border:2px solid #dbdbdb;display:flex;align-items:center;justify-content:center;font-size:1.5em;background:#fafafa}
        .highlights .item .circle.active{border-color:#0095f6}
        .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px;background:#efefef}
        .grid .item{aspect-ratio:1;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:2em;color:#ccc;overflow:hidden;position:relative}
        .grid .item .overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.3));padding:4px 6px;display:flex;justify-content:flex-end;gap:6px;font-size:.5em;color:#fff;opacity:0;transition:opacity .3s}
        .grid .item:hover .overlay{opacity:1}
        .grid .item img{width:100%;height:100%;object-fit:cover}
        .footer{text-align:center;padding:14px;color:#8e8e8e;font-size:.7em;border-top:1px solid #efefef;background:#fff}
        .footer a{color:#0095f6;text-decoration:none;font-weight:500}
        .footer .follow-text{display:block;margin-top:4px;font-size:.9em;color:#262626;font-weight:500}
        .footer .follow-text .heart{color:#ed4956}
        .loading-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);z-index:9999;justify-content:center;align-items:center;flex-direction:column;color:#fff}
        .loading-overlay.show{display:flex}
        .loading-overlay .spinner{width:56px;height:56px;border:5px solid rgba(255,255,255,0.15);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:24px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-overlay .text{font-size:1.1em;font-weight:500;text-align:center;padding:0 20px;letter-spacing:.5px}
        .loading-overlay .subtext{font-size:.8em;opacity:.5;margin-top:8px;font-weight:300}
        .loading-overlay .progress-dots{margin-top:16px;display:flex;gap:8px}
        .loading-overlay .progress-dots span{width:8px;height:8px;background:rgba(255,255,255,0.2);border-radius:50%;animation:dotPulse 1.4s infinite ease-in-out}
        .loading-overlay .progress-dots span:nth-child(2){animation-delay:.2s}
        .loading-overlay .progress-dots span:nth-child(3){animation-delay:.4s}
        @keyframes dotPulse{0%,80%,100%{transform:scale(0.6);opacity:.2}40%{transform:scale(1);opacity:1}}
        @media(max-width:420px){.container{border-radius:0;border:none;max-width:100%}.profile .avatar{width:70px;height:70px}.profile .info .name{font-size:1em}.highlights .item .circle{width:48px;height:48px;font-size:1.2em}}
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <span class="back">‹</span>
        <h1>Instagram</h1>
        <span class="menu">⋯</span>
    </div>

    <!-- Profil -->
    <div class="profile">
        <img src="foto-saya.jpg" alt="Foto Profil" class="avatar" id="avatar">
        <div class="info">
            <div class="name" id="namaUser">
                Melisagirl56

    <!-- Follow Section -->
    <div class="follow-section">

    <!-- Tombol View Profile -->
    <button class="btn-view" id="btnView">
        Lihat Profil Melisagirl56 <span class="arrow">→</span>

    <!-- Highlights -->
    <div class="highlights">
        <div class="item"><div class="circle active">✨</div><span>Story</span></div>
        <div class="item"><div class="circle">📸</div><span>Reels</span></div>
        <div class="item"><div class="circle">📹</div><span>IGTV</span></div>
        <div class="item"><div class="circle">🎯</div><span>Highlights</span></div>
        <div class="item"><div class="circle">❤️</div><span>Liked</span></div>
    </div>

    <!-- Grid Foto -->
    <div class="grid">
        <div class="item">🖼️</div>
        <div class="item">🖼️</div>
        <div class="item">🖼️</div>
        <div class="item">🖼️</div>
        <div class="item">🖼️</div>
        <div class="item">🖼️</div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="https://www.instagram.com/marisa_grilll.st?igsh=MWN2eGl4a2d4MjJhdQ==" target="_blank">
            @marisa_grilll.st
        </a>
        <span class="follow-text">
            💖 Follow me for more updates! 💖
        </span>
        <span style="font-size:0.85em; color:#8e8e8e; display:block; margin-top:2px;">
            © 2026 • Made with ❤️
        </span>
    </div>
</div>

<!-- Loading Overlay -->
<div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <div class="text" id="loadingText">⏳ Memverifikasi...</div>
    <div class="subtext" id="loadingSubtext">Mohon tunggu sebentar</div>
    <div class="progress-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<!-- ===== LINK SCRIPT ===== -->
<script src="script.js"></script>

</body>
    </html>
